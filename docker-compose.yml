# =====================================================================
# person-log 编排：mysql + app 两个服务
# 数据库：docker compose up -d mysql
# 全栈：  docker compose up -d --build（首次启动自动建表并创建管理员）
# 停止：  docker compose down（数据保留在卷里；加 -v 会连数据卷一起删除，慎用）
# =====================================================================
name: person-log

services:
  mysql:
    image: mysql:8.4
    container_name: person-log-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-personlog_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-personlog}
      MYSQL_USER: ${MYSQL_USER:-personlog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-personlog_pwd}
      TZ: Asia/Shanghai
    ports:
      # 映射到宿主机 3307，避开本机已安装的 MySQL(3306)；容器内仍是 3306
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动执行建表脚本
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 在构建期内联，必须在 build 阶段传入
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: person-log-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      # 容器网络内通过服务名 mysql 访问（不能用 localhost），由 compose 自动拼接
      DATABASE_URL: mysql://${MYSQL_USER:-personlog}:${MYSQL_PASSWORD:-personlog_pwd}@mysql:3306/${MYSQL_DATABASE:-personlog}
      # 会话签名密钥，必填：openssl rand -hex 32
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET（openssl rand -hex 32）}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # 首次启动且用户表为空时创建管理员（之后改这里不会覆盖已有账号）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      # 可选：未配置时邮件通知自动跳过
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    volumes:
      # 上传的图片/音频持久化，重建镜像不丢
      - uploads_data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
