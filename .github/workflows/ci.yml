name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: personlog
          MYSQL_USER: personlog
          MYSQL_PASSWORD: personlog_pwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://personlog:personlog_pwd@127.0.0.1:3306/personlog
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123456
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare database
        run: |
          npm run db:push
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Smoke tests
        run: npm run test:smoke

      - name: E2E tests
        run: npm run test:e2e

      - name: Uploads GC dry-run
        run: npm run uploads:gc

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: pkill -f "next start" || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          AUTH_SECRET=ci-secret \
          MYSQL_ROOT_PASSWORD=ci-root \
          MYSQL_PASSWORD=ci-pwd \
          ADMIN_PASSWORD=ci-admin-password \
          docker compose config > /dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: person-log:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
